# Rendered by Noctalia (user template "yazi") into
# <config>/yazi/flavors/noctalia.yazi/flavor.toml. DO NOT EDIT: regenerated on
# every theme change. Selected by `[flavor] dark = "noctalia"` in yazi.toml
# (see tools/yazi.nix).

[manager]
cwd = { fg = "{{ colors.tertiary.default.hex }}", italic = true }
hovered = { fg = "{{ colors.on_surface.default.hex }}", bg = "{{ colors.surface_variant.default.hex }}", bold = true }
preview_hovered = { underline = true }
find_keyword = { fg = "{{ colors.error.default.hex }}", bold = true }
find_position = { fg = "{{ colors.tertiary.default.hex }}", normal = true }
marker_selected = { fg = "{{ colors.tertiary.default.hex }}", bg = "{{ colors.tertiary.default.hex }}" }
marker_copied = { fg = "{{ colors.primary.default.hex }}", bg = "{{ colors.primary.default.hex }}" }
marker_cut = { fg = "{{ colors.error.default.hex }}", bg = "{{ colors.error.default.hex }}" }
tab_active = { fg = "{{ colors.on_surface.default.hex }}", bg = "{{ colors.surface_variant.default.hex }}", bold = true }
tab_inactive = { fg = "{{ colors.on_surface_variant.default.hex }}", bg = "{{ colors.surface.default.hex }}" }
border_style = { fg = "{{ colors.outline.default.hex }}" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "{{ colors.surface_variant.default.hex }}", bg = "{{ colors.surface_variant.default.hex }}" }
mode_normal = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}", bold = true }
mode_select = { fg = "{{ colors.on_tertiary.default.hex }}", bg = "{{ colors.tertiary.default.hex }}", bold = true }
mode_unset = { fg = "{{ colors.on_error.default.hex }}", bg = "{{ colors.error.default.hex }}", bold = true }
progress_label = { fg = "{{ colors.on_surface.default.hex }}", bold = true }
progress_normal = { fg = "{{ colors.primary.default.hex }}", bg = "{{ colors.surface_variant.default.hex }}" }
progress_error = { fg = "{{ colors.error.default.hex }}", bg = "{{ colors.surface_variant.default.hex }}" }
permissions_t = { fg = "{{ colors.primary.default.hex }}" }
permissions_r = { fg = "{{ colors.secondary.default.hex }}" }
permissions_w = { fg = "{{ colors.error.default.hex }}" }
permissions_x = { fg = "{{ colors.tertiary.default.hex }}" }
permissions_s = { fg = "{{ colors.on_surface_variant.default.hex }}" }

[filetype]
rules = [
  { mime = "image/*", fg = "{{ colors.tertiary.default.hex }}" },
  { mime = "video/*", fg = "{{ colors.secondary.default.hex }}" },
  { mime = "audio/*", fg = "{{ colors.primary.default.hex }}" },
  { mime = "application/zip", fg = "{{ colors.error.default.hex }}" },
  { mime = "application/tar", fg = "{{ colors.error.default.hex }}" },
  { mime = "application/bzip2", fg = "{{ colors.error.default.hex }}" },
  { mime = "application/gzip", fg = "{{ colors.error.default.hex }}" },
  { mime = "application/x-tar", fg = "{{ colors.error.default.hex }}" },
  { mime = "application/x-7z-compressed", fg = "{{ colors.error.default.hex }}" },
  { mime = "application/x-rar", fg = "{{ colors.error.default.hex }}" },
  { url = "*/", fg = "{{ colors.primary.default.hex }}", bold = true },
  { url = "*", fg = "{{ colors.on_surface.default.hex }}" },
]
