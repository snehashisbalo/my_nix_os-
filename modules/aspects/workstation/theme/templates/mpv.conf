# Rendered by Noctalia (user template "mpv") into
# <config>/mpv/noctalia.conf. DO NOT EDIT: regenerated on every theme change.
# Included by mpv.conf (see tools/mpv.nix), which owns everything else.
sub-color="{{ colors.on_surface.default.hex }}"
sub-border-color="{{ colors.surface.default.hex }}"
osd-color="{{ colors.on_surface.default.hex }}"
osd-border-color="{{ colors.surface.default.hex }}"
# uosc takes a comma-separated key=value list of hex colours WITHOUT the '#'.
script-opts=uosc-color=foreground={{ colors.primary.default.hex_stripped }},foreground_text={{ colors.on_surface.default.hex_stripped }},background={{ colors.surface.default.hex_stripped }},background_text={{ colors.on_surface.default.hex_stripped }},curtain={{ colors.surface.default.hex_stripped }},success={{ colors.tertiary.default.hex_stripped }},error={{ colors.error.default.hex_stripped }}
